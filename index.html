<!--
  Site entry point for GitHub Pages.

  The map itself is built to public-trashcan-locations/index.html, because
  build_maps.py writes every map into its own slug folder. GitHub Pages can
  only serve a site from the repo root or /docs, so this sends the root
  straight through to the map rather than letting Jekyll render README.md as
  the front page.

  To embed the map, point the iframe at the map's own path, not at this file:
  https://eesedla.github.io/public-can-locations/public-trashcan-locations/
-->

<link rel="canonical" href="https://eesedla.github.io/public-can-locations/public-trashcan-locations/">
<meta http-equiv="refresh" content="0; url=public-trashcan-locations/">
<script>location.replace("public-trashcan-locations/" + location.search + location.hash);</script>
