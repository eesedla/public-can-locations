<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cleveland public trash cans by ward</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root {
    --accent:#F4C913;
    --ink:#404F54;
    --teal:#23685b;
    --teal-mid:#5fa896;
    --teal-light:#a9d2cf;
    --teal-pale:#dbe7e3;
    --gray:#879599;
    --gray-line:#ccd8db;
    --rc:'Roboto Condensed','Arial Narrow',sans-serif;
    --inter:'Inter',Arial,sans-serif;
    --gotham:'Gotham','Gotham Medium',sans-serif;
  }

  * { box-sizing: border-box; }

  /* Body: transparent, flex-centered. No min-height:100vh -- it makes embed
     heights ratchet upward. */
  body {
    margin: 0;
    padding: 32px 16px;
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    color: var(--ink);
    font-family: var(--inter);
  }

  .viz-container {
    position: relative;
    width: 100%;
    max-width: 900px;
    background: #fff;
  }
  .viz-container::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--accent);
  }

  /* ---- header ---- */
  .viz-header { padding: 20px 20px 16px; }
  .viz-kicker {
    font-family: var(--gotham);
    font-weight: 500;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: .65;
    margin-bottom: 6px;
  }
  .viz-heading {
    font-family: var(--rc);
    font-weight: 700;
    font-size: 22px;
    line-height: 1.3;
    margin: 0 0 6px;
  }
  .viz-subheading {
    font-family: var(--inter);
    font-weight: 500;
    font-size: 14px;
    line-height: 1.5;
    opacity: .72;
    margin: 0;
  }

  /* ---- standfirst line under the heading ---- */
  .viz-controls {
    padding: 0 20px 14px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toggle-hint {
    font-family: var(--inter);
    font-size: 12px;
    opacity: .55;
  }

  /* ---- body ---- */
  .viz-body { display: flex; flex-wrap: wrap; align-items: stretch; }
  .map-wrap {
    position: relative;
    flex: 1 1 360px;
    min-width: 260px;
    height: 560px;
  }
  #map { position: absolute; inset: 0; background: #223; }
  .viz-side {
    flex: 0 1 268px;
    min-width: 230px;
    height: 560px;
    overflow-y: auto;
    padding: 0 16px 16px;
  }
  .viz-side h2 {
    font-family: var(--rc);
    font-weight: 600;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    opacity: .55;
    margin: 0 0 8px;
    padding-top: 2px;
  }

  table { border-collapse: collapse; width: 100%; font-family: var(--inter); font-size: 12px; }
  th, td { text-align: right; padding: 6px 4px; border-bottom: 1px solid rgba(64,79,84,0.12); }
  th:first-child, td:first-child { text-align: left; }
  th {
    font-family: var(--rc);
    font-weight: 500;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    opacity: .55;
    position: sticky;
    top: 0;
    background: #fff;
  }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: rgba(35,104,91,0.06); }
  tbody tr.selected { background: rgba(244,201,19,0.18); }

  /* ---- legend ---- */
  /* Sits top-right inside the map; MapLibre's attribution owns bottom-right. */
  .legend {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 2;
    background: #fff;
    padding: 10px 12px;
    border-radius: 2px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.28);
  }
  .legend-title {
    font-family: var(--rc);
    font-weight: 600;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    opacity: .55;
    margin-bottom: 6px;
  }
  /* legend: the bubble size scale */
  .legend-bubbles {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding-top: 2px;
  }
  .legend-bubble-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-family: var(--rc);
    font-weight: 500;
    font-size: 0.72rem;
    color: var(--ink);
  }
  .legend-bubble {
    display: block;
    border-radius: 50%;
    border: 1.5px solid var(--teal);
    background-size: 74%;
    background-position: center;
    background-repeat: no-repeat;
  }

  /* ---- map buttons ---- */
  /* A row, so "Near me" slides left when "Whole city" is not showing. */
  .map-buttons {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 2;
    display: flex;
    gap: 6px;
  }
  .map-btn {
    font-family: var(--rc);
    font-weight: 600;
    font-size: 0.95rem;
    padding: 9px 16px;
    border-radius: 2px;
    background: #fff;
    border: 1px solid var(--gray-line);
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.28);
    white-space: nowrap;
  }
  .map-btn:hover { border-color: var(--teal); }
  .map-btn[disabled] { opacity: .6; cursor: default; }
  #reset { display: none; }
  #reset.show { display: block; }

  /* MapLibre's own geolocate button is hidden; this page drives the control
     from #locate instead, so the button matches the others. */
  .maplibregl-ctrl-geolocate { display: none; }

  /* ---- toast ---- */
  /* Geolocation fails quietly otherwise: denied, timed out, or simply not in
     Cleveland. This says so and gets out of the way. */
  .map-toast {
    position: absolute;
    left: 50%;
    bottom: 42px;
    transform: translateX(-50%);
    z-index: 6;
    max-width: 84%;
    background: var(--ink);
    color: #fff;
    font-family: var(--inter);
    font-size: 0.72rem;
    line-height: 1.45;
    padding: 8px 13px;
    border-radius: 2px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s;
    text-align: center;
  }
  .map-toast.visible { opacity: 1; }

  /* ---- tooltip ---- */
  /* Canonical .bar-tooltip spec. MapLibre has no sticky-tooltip primitive, so
     this is a plain div we move with the cursor (see showTip/hideTip). */
  .bar-tooltip {
    position: absolute;
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    transition: opacity .12s;
    background: var(--ink);
    color: #fff;
    font-family: var(--inter);
    font-size: 0.75rem;
    padding: 12px 16px;
    border-radius: 2px;
    max-width: 280px;
    min-width: 180px;
    border: 0;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    white-space: normal;
  }
  .bar-tooltip.visible { opacity: 1; }
  .bar-tooltip .tt-title { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
  .bar-tooltip .tt-total,
  .bar-tooltip .tt-sub {
    font-size: 0.68rem;
    opacity: .55;
    padding-bottom: 6px;
    margin-bottom: 6px;
    border-bottom: 1px solid rgba(255,255,255,0.25);
  }
  .bar-tooltip .tt-row { display: flex; align-items: center; gap: 7px; line-height: 1.7; }
  .bar-tooltip .tt-row .dot {
    width: 9px; height: 9px; border-radius: 2px; flex: none;
    border: 1px solid rgba(255,255,255,0.28);
  }
  .bar-tooltip .tt-count,
  .bar-tooltip .tt-val { font-weight: 600; margin-left: auto; }

  /* ---- notes ---- */
  .viz-source {
    font-family: var(--inter);
    font-size: 11px;
    opacity: .5;
    padding: 16px 20px 20px;
    line-height: 1.5;
  }
  .viz-source a { color: inherit; }

  /* Below this the map and table stack, so both have to give height back or
     the embed becomes a very long scroll on a phone. */
  @media (max-width: 640px) {
    .map-wrap { height: 420px; }
    /* Stacked under the map, the table runs its full length. A scrollbox
       inside a page that already scrolls is a trap: readers miss the rows
       below the fold and the sticky header prints over the first row. */
    .viz-side {
      height: auto;
      overflow: visible;
      padding: 12px 20px 16px;
    }
    .viz-side th { position: static; }
    .legend { top: 8px; right: 8px; padding: 7px 9px; }
    .legend-bubbles { gap: 7px; }
  }

  /* MapLibre's attribution over imagery: keep it legible but quiet. */
  .maplibregl-ctrl-attrib {
    font-family: var(--inter);
    font-size: 10px;
  }
  .maplibregl-canvas:focus { outline: none; }
</style>
</head>
<body>

<div class="viz-container">

  <div class="viz-header">
    <div class="viz-kicker">Signal Cleveland</div>
    <h1 class="viz-heading" id="heading"></h1>
    <p class="viz-subheading" id="subheading"></p>
  </div>

  <div class="viz-controls">
    <span class="toggle-hint">Each bubble covers an area; the bigger it is, the more cans it holds. Press one to zoom in, and press a single can to go down to it.</span>
  </div>

  <div class="viz-body">
    <div class="map-wrap">
      <div id="map"></div>
      <div class="map-buttons">
        <button class="map-btn" id="reset">Whole city</button>
        <button class="map-btn" id="locate">Near me</button>
      </div>
      <div class="map-toast" id="toast"></div>
      <div class="legend" id="legend"></div>
      <div class="bar-tooltip" id="tip"></div>
    </div>
    <div class="viz-side">
      <h2>Ranked wards</h2>
      <table id="tbl">
        <thead><tr><th>Ward</th><th>Cans</th><th>Population</th><th>Per 10k</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="viz-source" id="source"></div>

</div>

<script>
const DATA = __GEOJSON__;
const POINTS = __POINTS__;
const META = __META__;

const INK = "#404F54";
const ACCENT = "#F4C913";
const fmt = n => n.toLocaleString("en-US");

// The whole city. Matches the ward file's own bounding box.
const CITY_BOUNDS = [[-81.87910, 41.39074], [-81.53291, 41.59951]];

// Padding has to scale with the box. A flat 48px is comfortable in a desktop
// column and absurd on a phone, where it would eat a third of the width and
// push the city down two zoom levels.
function fitPadding() {
  const w = (document.querySelector(".map-wrap") || {}).clientWidth || 600;
  return Math.max(10, Math.min(48, Math.round(w * 0.07)));
}

// Pressing a can drops to this zoom: close enough to see the sidewalk it is
// on, far enough out to keep the block around it in frame.
const CAN_ZOOM = 16.4;

// Below this zoom cans gather into bubbles; above it every can draws on its
// own. 13 puts the switch at roughly "one neighborhood fills the frame".
const CLUSTER_MAX_ZOOM = 13;

// ---- the map ---------------------------------------------------------------
// Esri World Imagery as a raster source: real tiles through z19 here, where
// USGS imagery caps at z16. The attribution string is Esri's condition of use.
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      sat: {
        type: 'raster',
        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        tileSize: 256,
        maxzoom: 19,
        attribution: 'Imagery: Esri, Maxar, Earthstar Geographics'
      }
    },
    layers: [{ id: 'sat', type: 'raster', source: 'sat' }]
  },
  bounds: CITY_BOUNDS,
  fitBoundsOptions: { padding: fitPadding() },
  maxZoom: 19
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-left");

// Is the reader still looking at the whole city, or have they gone somewhere?
let atHome = true;
function leaveHome() { atHome = false; }

// MapLibre watches the window, not its own container. Inside an embed the
// container changes width on its own -- webfonts landing, the parent page
// reflowing, a phone rotating -- and without this the canvas keeps the old
// size and the map ends up drawn into part of the box.
//
// resize() keeps the centre and zoom, not the bounds, so a container that
// grows after the first fit leaves the city as a speck in the middle of Lake
// Erie. While the reader has not navigated anywhere, re-fit instead.
if (window.ResizeObserver) {
  new ResizeObserver(() => {
    map.resize();
    const sc = iconScale();
    ["clusters", "can-points"].forEach(id => {
      if (map.getLayer(id)) map.setLayoutProperty(id, "icon-size", sc);
    });
    if (atHome) map.fitBounds(CITY_BOUNDS, { padding: fitPadding(), duration: 0 });
  }).observe(document.querySelector(".map-wrap"));
}

// Any real navigation means the view is theirs now, not ours to re-fit.
["dragstart", "rotatestart", "pitchstart"].forEach(ev => map.on(ev, leaveHome));
map.on("zoomstart", e => { if (e.originalEvent) leaveHome(); });

// ---- the marker -------------------------------------------------------------
// The can artwork is drawn over a disc this code paints, rather than the disc
// that came baked into the source PNG, so a bubble can carry its count twice:
// once in how big it is, once in how dark it is. Both encode the same number,
// which is the only way two channels should ever be spent on one variable.
//
// Diameter runs as count^0.28, not the square root that true area scaling
// would want -- at 830 cans a true-area bubble would swallow the lake. The
// number on the bubble carries the precision; size and colour carry the gist.
// The marker rides inside the page as a data URI rather than sitting beside
// it as a file. One file has no relative paths to resolve, so the map works
// the same uploaded as a ZIP, dropped on a static host, or pasted into a CMS
// block -- none of which agree about where a sibling file lives.
const ICON_SRC = "__CAN_ICON__";
const DPR = 2;

// CPD teal ramp, palest to primary.
const RAMP = [
  { upto: 4,        fill: "#daeae5" },
  { upto: 24,       fill: "#a9d2cf" },
  { upto: 99,       fill: "#51a89a" },
  { upto: Infinity, fill: "#23685b" }
];
const RING = "#23685b";

function bubbleDiameter(cans) {
  return Math.min(124, Math.max(28, 24 * Math.pow(cans, 0.28)));
}
// Bubbles are sized for a desktop-width map. On a phone the same art covers
// a third of the frame, so the whole set scales down with the container.
function iconScale() {
  const w = (document.querySelector(".map-wrap") || {}).clientWidth || 560;
  return Math.max(0.62, Math.min(1, w / 560));
}

function bubbleFill(cans) {
  return RAMP.find(step => cans <= step.upto).fill;
}

// A bubble standing for many cans covers ground the reader wants to see, so it
// sits slightly sheer and lets the imagery through. Once you have drilled down
// to a can or two the disc is a real place, not a tally, and goes solid.
function bubbleAlpha(cans) {
  if (cans <= 2) return 1;
  if (cans <= 24) return 0.84;
  return 0.76;
}

let markerImg = null;

function makeIcon(cans) {
  const d = bubbleDiameter(cans);
  const label = cans > 1 ? fmt(cans) : "";

  const probe = document.createElement("canvas").getContext("2d");
  probe.font = '700 12px "Roboto Condensed","Arial Narrow",sans-serif';
  const pillW = label ? Math.max(22, Math.round(probe.measureText(label).width) + 14) : 0;
  const pillH = 17;

  // Square canvas with the disc dead centre, so MapLibre's default centre
  // anchor puts the disc on the coordinate and the pill just overhangs it.
  const side = Math.max(d + 26, pillW + 8);
  const c = document.createElement("canvas");
  c.width = c.height = Math.ceil(side * DPR);
  const g = c.getContext("2d");
  g.scale(DPR, DPR);
  const cx = side / 2, cy = side / 2;

  g.shadowColor = "rgba(0,0,0,0.45)";
  g.shadowBlur = 4;
  g.shadowOffsetY = 1.5;
  g.beginPath();
  g.arc(cx, cy, d / 2, 0, Math.PI * 2);
  g.fillStyle = bubbleFill(cans);
  g.globalAlpha = bubbleAlpha(cans);
  g.fill();
  g.globalAlpha = 1;
  g.shadowColor = "transparent";
  g.lineWidth = Math.max(1.5, d / 42);
  g.strokeStyle = RING;
  g.stroke();

  if (markerImg) {
    const gd = d * 0.78;
    g.drawImage(markerImg, cx - gd / 2, cy - gd / 2, gd, gd);
  }

  if (label) {
    const x = cx - pillW / 2, y = cy + d / 2 - 7, r = pillH / 2;
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + pillW, y, x + pillW, y + pillH, r);
    g.arcTo(x + pillW, y + pillH, x, y + pillH, r);
    g.arcTo(x, y + pillH, x, y, r);
    g.arcTo(x, y, x + pillW, y, r);
    g.closePath();
    g.fillStyle = ACCENT;
    g.fill();
    g.lineWidth = 1.6;
    g.strokeStyle = INK;
    g.stroke();
    g.fillStyle = INK;
    g.font = '700 12px "Roboto Condensed","Arial Narrow",sans-serif';
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillText(label, cx, y + pillH / 2 + 0.5);
  }

  return { data: g.getImageData(0, 0, c.width, c.height), pixelRatio: DPR };
}

// Cluster counts are only known once the map has tiled the data, so the icons
// cannot be registered up front. MapLibre asks for each one by name the first
// time it needs to draw it, and this answers.
map.on("styleimagemissing", e => {
  const m = /^can-(\d+)$/.exec(e.id);
  if (!m || !markerImg || map.hasImage(e.id)) return;
  const icon = makeIcon(parseInt(m[1], 10));
  map.addImage(e.id, icon.data, { pixelRatio: icon.pixelRatio });
});

// ---- tooltips ---------------------------------------------------------------
const tip = document.getElementById("tip");
const wrap = document.querySelector(".map-wrap");

function showTip(html, pt) {
  tip.innerHTML = html;
  tip.classList.add("visible");
  const w = wrap.getBoundingClientRect();
  const t = tip.getBoundingClientRect();
  let x = pt.x + 14, y = pt.y - t.height / 2;
  if (x + t.width > w.width - 6) x = pt.x - t.width - 14;
  tip.style.left = Math.max(6, x) + "px";
  tip.style.top = Math.min(Math.max(6, y), w.height - t.height - 6) + "px";
}
function hideTip() { tip.classList.remove("visible"); }

function clusterTooltip(p) {
  return '<div class="tt-title">' + fmt(p.cans) + " trash cans</div>" +
         '<div class="tt-sub">in this part of the city</div>' +
         '<div class="tt-row" style="opacity:.6">Press to zoom in</div>';
}

function canTooltip(p) {
  const others = JSON.parse(p.also || "[]");
  return '<div class="tt-title">' + p.address + "</div>" +
         '<div class="tt-sub">' + (p.n === 1 ? "1 public trash can"
                                             : fmt(p.n) + " public trash cans here") + "</div>" +
         others.map(a => '<div class="tt-row" style="opacity:.6">' + a + "</div>").join("");
}

// ---- layers ------------------------------------------------------------------
function addLayers() {
  // Ward outlines stay for orientation only -- nothing is shaded by ward any
  // more, the cans speak for themselves.
  map.addSource("wards", { type: "geojson", data: DATA });
  map.addLayer({
    id: "ward-line", type: "line", source: "wards",
    paint: { "line-color": "#ffffff", "line-width": 1.2, "line-opacity": 0.55 }
  });

  map.addSource("cans", {
    type: "geojson",
    cluster: true,
    clusterRadius: 44,
    clusterMaxZoom: CLUSTER_MAX_ZOOM,
    // A marker can stand for several cans at one corner, so the bubbles have
    // to add up cans, not markers.
    clusterProperties: { cans: ["+", ["get", "n"]] },
    data: {
      type: "FeatureCollection",
      features: POINTS.map(p => ({
        type: "Feature",
        properties: { address: p.address, n: p.n, also: JSON.stringify(p.also || []) },
        geometry: { type: "Point", coordinates: [p.lon, p.lat] }
      }))
    }
  });

  map.addLayer({
    id: "clusters", type: "symbol", source: "cans", filter: ["has", "point_count"],
    layout: {
      "icon-image": ["concat", "can-", ["to-string", ["get", "cans"]]],
      "icon-size": iconScale(),
      "icon-allow-overlap": true,
      "icon-ignore-placement": true
    }
  });

  map.addLayer({
    id: "can-points", type: "symbol", source: "cans", filter: ["!", ["has", "point_count"]],
    layout: {
      "icon-image": ["concat", "can-", ["to-string", ["get", "n"]]],
      "icon-size": iconScale(),
      "icon-allow-overlap": true,
      "icon-ignore-placement": true
    }
  });

  const pointer = on => map.getCanvas().style.cursor = on ? "pointer" : "";

  map.on("mousemove", "clusters", e => {
    pointer(true);
    showTip(clusterTooltip(e.features[0].properties), e.point);
  });
  map.on("mouseleave", "clusters", () => { pointer(false); hideTip(); });

  map.on("mousemove", "can-points", e => {
    pointer(true);
    showTip(canTooltip(e.features[0].properties), e.point);
  });
  map.on("mouseleave", "can-points", () => { pointer(false); hideTip(); });

  // Press a bubble: go to the zoom where it breaks apart. Big bubbles split
  // into smaller ones first, which is the point -- you walk down into an area.
  map.on("click", "clusters", e => {
    const f = e.features[0];
    leaveHome();
    const src = map.getSource("cans");
    const go = z => {
      map.easeTo({ center: f.geometry.coordinates,
                   zoom: Math.max(z, map.getZoom() + 1.5),
                   duration: 800 });
      hideTip();
      showReset();
    };
    const r = src.getClusterExpansionZoom(f.properties.cluster_id, (err, z) => {
      if (!err) go(z);
    });
    if (r && typeof r.then === "function") r.then(go).catch(() => {});
  });

  // Press a can: drop to its block.
  map.on("click", "can-points", e => {
    const f = e.features[0];
    leaveHome();
    map.easeTo({ center: f.geometry.coordinates,
                 zoom: Math.max(map.getZoom(), CAN_ZOOM),
                 duration: 900 });
    showTip(canTooltip(f.properties), e.point);
    showReset();
  });
}

map.on("load", () => {
  const img = new Image();
  img.onload = () => { markerImg = img; addLayers(); };
  img.onerror = () => { console.error("the marker image failed to decode"); addLayers(); };
  img.src = ICON_SRC;

  renderTable();
  legendUpdate();
});

// ---- bounding box of a ward ------------------------------------------------
// MapLibre has no getBounds() on a feature, so walk the rings.
function featureBounds(f) {
  const b = new maplibregl.LngLatBounds();
  f.geometry.coordinates.forEach(ring => ring.forEach(c => b.extend(c)));
  return b;
}

// ---- legend ----------------------------------------------------------------
const legendEl = document.getElementById("legend");

function legendUpdate() {
  // Size and colour say the same thing, so one scale explains both.
  const steps = [[2, "1\u20134"], [12, "5\u201324"], [50, "25\u201399"], [200, "100+"]];
  const rows = steps.map(([n, label]) => {
    const px = Math.max(16, Math.round(bubbleDiameter(n) * 0.5));
    return '<div class="legend-bubble-row">' +
           '<span class="legend-bubble" style="width:' + px + "px;height:" + px +
             "px;background-color:" + bubbleFill(n) +
             ";background-image:url(" + ICON_SRC + ")" +
             ";opacity:" + bubbleAlpha(n) + '"></span>' +
           "<span>" + label + "</span>" +
           "</div>";
  }).join("");
  legendEl.innerHTML = '<div class="legend-title">Cans in an area</div>' +
                       '<div class="legend-bubbles">' + rows + "</div>";
}

// ---- side table ------------------------------------------------------------
const tbody = document.querySelector("#tbl tbody");
let selected = null;

function renderTable() {
  const rows = DATA.features.map(f => f.properties).sort((a, b) => b.count - a.count);
  tbody.innerHTML = rows.map(p =>
    '<tr data-ward="' + p.ward + '">' +
      "<td>" + p.name + "</td>" +
      "<td>" + fmt(p.count) + "</td>" +
      "<td>" + fmt(p.population) + "</td>" +
      "<td>" + p.per_10k + "</td>" +
    "</tr>").join("");
  [...tbody.rows].forEach(tr => tr.onclick = () => selectWard(+tr.dataset.ward));
  if (selected !== null) markRow(selected);
}

function markRow(ward) {
  [...tbody.rows].forEach(tr => tr.classList.toggle("selected", +tr.dataset.ward === ward));
}

const resetBtn = document.getElementById("reset");
function showReset() { resetBtn.classList.add("show"); }

function selectWard(ward) {
  leaveHome();
  selected = ward;
  markRow(ward);
  hideTip();
  const f = DATA.features.find(f => f.properties.ward === ward);
  if (f) map.fitBounds(featureBounds(f), { padding: 40 });
  showReset();
  const tr = tbody.querySelector('tr[data-ward="' + ward + '"]');
  if (tr) tr.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

resetBtn.onclick = () => {
  selected = null;
  atHome = true;
  markRow(-1);
  hideTip();
  map.fitBounds(CITY_BOUNDS, { padding: fitPadding() });
  resetBtn.classList.remove("show");
};

// ---- "Near me" --------------------------------------------------------------
// MapLibre's GeolocateControl does the permission dance, the blue dot and the
// accuracy ring; its own button is hidden in CSS and #locate triggers it, so
// the control matches the other buttons instead of MapLibre's chrome.
//
// Geolocation needs a secure context, and inside an iframe the embedding page
// has to hand the permission down with allow="geolocation" -- see
// wordpress-embed.html. Without it the browser refuses and we say so.
const toastEl = document.getElementById("toast");
let toastTimer = null;
function toast(msg, ms) {
  toastEl.textContent = msg;
  toastEl.classList.add("visible");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("visible"), ms || 5000);
}

const locateBtn = document.getElementById("locate");

if (!navigator.geolocation || !window.isSecureContext) {
  locateBtn.disabled = true;
  locateBtn.title = "Your browser will only share location over a secure connection";
} else {
  const geolocate = new maplibregl.GeolocateControl({
    positionOptions: { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 },
    trackUserLocation: false,
    showUserLocation: true,
    showAccuracyCircle: true,
    // Past the clustering cutoff, so you land among individual cans rather
    // than a bubble covering your neighborhood.
    fitBoundsOptions: { maxZoom: 16 }
  });
  map.addControl(geolocate);

  // Is this somewhere the map has anything to show?
  const inCity = (lng, lat) =>
    lng > CITY_BOUNDS[0][0] - 0.05 && lng < CITY_BOUNDS[1][0] + 0.05 &&
    lat > CITY_BOUNDS[0][1] - 0.04 && lat < CITY_BOUNDS[1][1] + 0.04;

  geolocate.on("geolocate", e => {
    locateBtn.disabled = false;
    leaveHome();
    const { longitude: lng, latitude: lat } = e.coords;
    selected = null;
    markRow(-1);
    showReset();
    if (inCity(lng, lat)) {
      const near = POINTS.reduce((best, p) => {
        const d = Math.hypot(p.lat - lat, (p.lon - lng) * 0.75) * 111000;
        return d < best.d ? { d: d, p: p } : best;
      }, { d: Infinity, p: null });
      toast(near.p && near.d < 1200
        ? "Nearest can: " + near.p.address + ", about " + Math.round(near.d) + " m away"
        : "No public cans mapped within a kilometre of you.");
    } else {
      toast("You are outside Cleveland, so there are no cans mapped around you. " +
            "Showing where you are anyway.", 7000);
    }
  });

  geolocate.on("error", err => {
    locateBtn.disabled = false;
    toast(err && err.code === 1
      ? "Location permission was denied, so the map cannot show what is near you."
      : "Could not work out where you are. Try again, or zoom in by hand.");
  });

  locateBtn.onclick = () => {
    hideTip();
    locateBtn.disabled = true;
    toast("Finding you\u2026", 12000);
    // The control only accepts trigger() once the browser has reported whether
    // geolocation is available at all, which it does just after setup.
    if (geolocate.trigger() === false) {
      locateBtn.disabled = false;
      toast("This browser will not share your location with the map.");
    }
  };
}

// ---- chrome ----------------------------------------------------------------
document.title = META.heading;
document.getElementById("heading").textContent = META.heading;

document.getElementById("subheading").textContent =
  fmt(META.mapped) + " " + META.noun + " mapped across the city’s 15 wards.";

document.getElementById("source").innerHTML =
  "Source: City of Cleveland public trash can locations and 2026 ward boundaries (Ord. No. 1-2025), " +
  "City of Cleveland Open Data. Population is U.S. Census Bureau American Community Survey " +
  "2020–2024 five-year estimates, aggregated by ward (citywide " + fmt(META.city_pop) + "). " +
  "Imagery: Esri, Maxar, Earthstar Geographics.";

// ---- embed auto-height -----------------------------------------------------
// Replaces pym.js (pym.nprapps.com is dead). Parent listener: wordpress-embed.html
(function () {
  var lastHeight = 0;
  function postHeight() {
    var h = Math.ceil(document.querySelector(".viz-container").getBoundingClientRect().height) + 64;
    if (h === lastHeight) return;
    lastHeight = h;
    if (window.parent !== window) {
      window.parent.postMessage({ type: "embed-height", height: h }, "*");
    }
  }
  window.addEventListener("load", postHeight);
  window.addEventListener("resize", postHeight);
  setInterval(postHeight, 500);
  postHeight();
})();
</script>
</body>
