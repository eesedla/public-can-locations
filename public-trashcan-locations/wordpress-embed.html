<!--
  WordPress parent embed. Paste into a Custom HTML block.
  Replace EMBED_URL below with the hosted path to this project's index.html.

  Pairs with the auto-height script at the bottom of index.html, which posts
  { type: 'embed-height', height } to the parent every 500ms.
  (pym.js replacement -- the NPR CDN at pym.nprapps.com is dead.)
-->

<iframe
  id="cpd-public-trashcan-locations"
  src="EMBED_URL"
  title="Where Cleveland’s public trash cans are"
  scrolling="no"
  frameborder="0"
  style="width:100%;border:0;display:block;height:820px;"
></iframe>

<script>
(function () {
  var frame = document.getElementById("cpd-public-trashcan-locations");
  if (!frame) return;

  window.addEventListener("message", function (e) {
    var d = e.data;
    if (!d || d.type !== "embed-height") return;

    // Only accept messages from this iframe.
    if (e.source !== frame.contentWindow) return;

    var h = parseInt(d.height, 10);
    if (!h || h < 100 || h > 5000) return;

    if (frame.offsetHeight !== h) frame.style.height = h + "px";
  }, false);
})();
</script>
